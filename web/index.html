<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>砖语 · 照片变乐高</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">

<style>
/* 图册式版面：标题牌记 — 可转的模型 + 搭建回放 — 对话框 — 零件清单 */
:root {
  --bg: #efe8d8;        /* 海图纸 */
  --panel: #f8f3e8;
  --ink: #241c14;
  --muted: #6d5f4d;
  --rule: #d2c5ab;
  --accent: #8c2f1b;    /* 火漆红 */
  --sea-top: #cfd9d6;
  --sea-bot: #9fb4b3;
  --font-display: "Noto Serif SC", "Songti SC", serif;
  --font-latin: "IM Fell English", Georgia, "Noto Serif SC", "Songti SC", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Noto Sans SC", "PingFang SC", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1619; --panel: #162126; --ink: #ece3cf; --muted: #a39881; --rule: #2a3a40;
    --accent: #e0835f; --sea-top: #1c2c33; --sea-bot: #0b1316; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1619; --panel: #162126; --ink: #ece3cf; --muted: #a39881; --rule: #2a3a40;
  --accent: #e0835f; --sea-top: #1c2c33; --sea-bot: #0b1316; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
[hidden] { display: none !important; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; display: grid; gap: 26px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px 32px; border-bottom: 1px solid var(--rule); padding-bottom: 18px; }
.title { display: grid; gap: 2px; }
.title .eyebrow { font-family: var(--font-latin); font-style: italic; color: var(--accent); font-size: 17px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 6vw, 56px); line-height: 1.05; letter-spacing: 0.04em; text-wrap: balance; }
h1 small { font-family: var(--font-latin); font-weight: 400; font-size: 0.48em; letter-spacing: 0; color: var(--muted); margin-left: 0.3em; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; }
.stats div { display: grid; }
.stats dt { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
.stats dd { margin: 0; font-family: var(--font-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats dd span { font-size: 13px; color: var(--muted); font-weight: 400; }

.viewer { position: relative; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: linear-gradient(180deg, var(--sea-top), var(--sea-bot)); }
#stage { width: 100%; height: min(62vh, 580px); min-height: 360px; touch-action: none; cursor: grab; }
#stage canvas { display: block; }
#stage:active { cursor: grabbing; }
.status { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; text-align: center; color: var(--muted); font-size: 14px; padding: 24px; }
.status b { font-family: var(--font-display); font-size: 19px; color: var(--ink); font-weight: 700; }
.status img { max-width: min(76%, 520px); max-height: 46vh; border-radius: 6px; border: 1px solid var(--rule); }
.status .bar { width: min(280px, 60%); height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.status .bar i { display: block; height: 100%; width: 35%; background: var(--accent); animation: slide 1.6s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
.hint { position: absolute; top: 12px; left: 14px; font-size: 12px; color: var(--muted); pointer-events: none; }
.compass { position: absolute; top: 10px; right: 14px; font-family: var(--font-latin); font-style: italic; font-size: 13px; color: var(--muted); pointer-events: none; }

.rail { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px 16px; padding: 12px 16px; border-top: 1px solid var(--rule); background: var(--panel); }
.rail .step { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rail .step b { font-size: 22px; color: var(--accent); }
.rail .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
input[type=range] { width: 100%; accent-color: var(--accent); }
button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 4px; padding: 5px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 14px; padding: 8px 18px; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 640px) { .rail { grid-template-columns: 1fr; } .rail .btns { justify-content: flex-start; } }

/* 对话框 */
.chat { border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); display: grid; }
.chat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.chat-head h2 { margin: 0; }
.chat-head .state { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.chat-head .state.live b { color: var(--accent); }
#log { max-height: 46vh; min-height: 120px; overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; scroll-behavior: smooth; }
.msg { display: grid; gap: 6px; max-width: 760px; }
.msg .who { font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .body.rich { white-space: normal; }
.msg .body.rich > :first-child { margin-top: 0; }
.msg .body.rich > :last-child { margin-bottom: 0; }
.msg .body.rich p { margin: 0 0 .6em; }
.msg .body.rich ul { margin: 0 0 .6em; padding-left: 1.2em; }
.msg .body.rich li { margin: .15em 0; }
.msg .body.rich code { font-family: var(--font-mono); font-size: .88em; background: #0000000d; border: 1px solid var(--rule); border-radius: 3px; padding: .05em .35em; }
.msg.me { justify-self: end; text-align: right; }
.msg.me .body { background: var(--accent); color: #fff; border-radius: 10px 10px 2px 10px; padding: 8px 12px; text-align: left; }
.msg.bot .body { background: var(--bg); border: 1px solid var(--rule); border-radius: 10px 10px 10px 2px; padding: 8px 12px; }
.msg img.shot { max-width: min(320px, 70%); border-radius: 6px; border: 1px solid var(--rule); display: block; }
.msg.me img.shot { margin-left: auto; }
.trace { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
.trace div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trace .err { color: var(--accent); }
.stage-line { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.stage-line::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.stage-line.done, .stage-line.failed { font-size: 14px; color: var(--ink); font-weight: 600; margin: 4px 0 2px; }
.stage-line.done::before { content: "✓"; width: auto; height: auto; border-radius: 0; background: none; color: #2f7d32; font-size: 15px; font-weight: 700; }
.stage-line.failed::before { content: "×"; width: auto; height: auto; border-radius: 0; background: none; color: var(--accent); font-size: 16px; font-weight: 700; }
.renders { display: flex; gap: 8px; flex-wrap: wrap; }
.renders img { width: 160px; border-radius: 4px; border: 1px solid var(--rule); background: #000; cursor: zoom-in; }

.composer { border-top: 1px solid var(--rule); padding: 12px 16px; display: grid; gap: 10px; }
.composer .row { display: flex; gap: 10px; align-items: flex-end; }
textarea { flex: 1; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 9px 12px; resize: vertical; min-height: 46px; max-height: 180px; }
.composer .opts { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.composer select { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 8px; }
.thumb { position: relative; }
.thumb img { height: 58px; width: 58px; object-fit: cover; border-radius: 6px; border: 1px solid var(--rule); display: block; }
.thumb button { position: absolute; top: -8px; right: -8px; border-radius: 50%; width: 22px; height: 22px; padding: 0; line-height: 1; background: var(--panel); }
.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
h2 { font-family: var(--font-display); font-weight: 900; font-size: 21px; margin: 0 0 4px; letter-spacing: 0.04em; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.tbl { overflow-x: auto; max-height: 520px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { position: sticky; top: 0; background: var(--bg); text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0.06em; border-bottom: 1px solid var(--rule); padding: 6px 8px; }
td { border-bottom: 1px solid var(--rule); padding: 6px 8px; vertical-align: middle; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
td.id { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); vertical-align: -2px; margin-right: 8px; }
.ref-shot { max-width: 100%; border-radius: 6px; border: 1px solid var(--rule); margin-top: 10px; }
.badge { display: inline-block; font-size: 12px; font-family: var(--font-mono); border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.badge.ok { color: var(--accent); border-color: var(--accent); }
dialog { border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 0; max-width: 92vw; }
dialog img { display: block; max-width: 92vw; max-height: 86vh; }
dialog::backdrop { background: #000a; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <span class="eyebrow" id="eyebrow">拍一张照片，说一句话，变成真能搭出来的乐高</span>
      <h1 id="h1">砖语<small>BrickStudio</small></h1>
    </div>
    <dl class="stats">
      <div><dt>零件</dt><dd id="st-parts">–</dd></div>
      <div><dt>种类</dt><dd id="st-kinds">–</dd></div>
      <div><dt>尺寸</dt><dd id="st-size">–</dd></div>
      <div><dt>回放步骤</dt><dd id="st-steps">–</dd></div>
    </dl>
  </header>

  <section class="viewer" aria-label="3D 模型">
    <div id="stage"></div>
    <div class="status" id="status">
      <b>上传一张照片，告诉我你想要什么</b>
      <img id="status-shot" alt="最新的渲染" hidden>
      <span id="status-note">下面的对话框里写一句话就行。生成一个模型大约十来分钟，过程会实时显示。</span>
      <span class="bar" id="status-bar" hidden><i></i></span>
    </div>
    <div class="hint" id="hint" hidden>拖动旋转 · 滚轮缩放 · 右键平移</div>
    <div class="compass" id="compass" hidden>真实零件 · 已通过 BrickAgent 检查</div>
    <div class="rail" id="rail" hidden>
      <div class="step">第 <b id="stepNo">–</b> / <span id="stepMax">–</span> 层</div>
      <input id="slider" type="range" min="0" max="1" value="1" aria-label="搭建步骤">
      <div class="btns">
        <button id="prev" type="button">上一步</button>
        <button id="next" type="button">下一步</button>
        <button id="play" type="button" aria-pressed="false">播放</button>
        <button id="hl" type="button" aria-pressed="true">高亮本层</button>
        <button id="dl" type="button">下载 .mpd</button>
      </div>
    </div>
  </section>

  <section class="chat">
    <div class="chat-head">
      <h2>对话</h2>
      <span style="display:flex;align-items:center;gap:12px">
        <span class="state" id="state">闲置</span>
        <button type="button" id="fresh" hidden>搭个新的</button>
      </span>
    </div>
    <div id="log" aria-live="polite"></div>
    <form class="composer" id="composer">
      <div class="row">
        <div class="thumb" id="thumb" hidden><img id="thumb-img" alt="参考照片"><button type="button" id="thumb-x" title="移除照片">×</button></div>
        <textarea id="text" rows="1" placeholder="想搭什么？例如：按这张照片搭我家的猫，姿势是趴着的，颜色偏橘。"></textarea>
        <button type="button" id="pick" title="上传或拍摄照片">照片</button>
        <button type="submit" class="primary" id="send">生成</button>
      </div>
      <div class="opts">
        <label>规模 <select id="size">
          <option value="quick">速写 · 约 80 件 · 较快</option>
          <option value="model" selected>标准 · 不超过 400 件</option>
          <option value="set">大型套装 · 400–4000 件 · 很慢</option>
        </select></label>
        <span id="jobline"></span>
      </div>
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
    </form>
  </section>

  <div class="cols">
    <section>
      <h2>这一件</h2>
      <p class="sub" id="card-sub">还没有模型。</p>
      <div id="card-body"></div>
      <img class="ref-shot" id="ref-shot" alt="参考照片" hidden>
    </section>
    <section>
      <h2>零件清单</h2>
      <p class="sub">LDraw 编号 · 全部为真实存在的零件</p>
      <div class="tbl"><table><thead><tr><th>零件</th><th>编号</th><th>颜色</th><th class="num">数量</th></tr></thead><tbody id="allBody"></tbody></table></div>
    </section>
  </div>
</div>
<dialog id="lightbox"><img id="lightbox-img" alt=""></dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
